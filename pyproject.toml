[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "s2-compress-py"
description = "S2 block compression for Python, compatible with Go klauspost/compress/s2"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES"]
readme = "README.md"
authors = [{name = "Axiros GmbH"}]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/axiros/s2-compress-py"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "s2compress"
